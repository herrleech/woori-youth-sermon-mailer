<head>

<meta name="theme-color" content="#f6f6f6">
<title>한 구절 묵상</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
// 화면 테마(시스템/라이트/다크): 첫 화면을 그리기 전에 적용해서 깜빡임을 막는다. 설정 화면이 window.applyTheme 를 호출한다.
(function () {
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  try { window.__theme = localStorage.getItem("qt.theme") || "system"; } catch (e) { window.__theme = "system"; }
  window.applyTheme = function (pref) {
    if (pref) { window.__theme = pref; try { localStorage.setItem("qt.theme", pref); } catch (e) { /* ignore */ } }
    var dark = window.__theme === "dark" || (window.__theme === "system" && mq && mq.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = dark ? "#000000" : "#f6f6f6";
  };
  window.applyTheme();
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (window.__theme === "system") window.applyTheme(); });
})();
</script>
<link rel="stylesheet" href="vendor/quill.snow.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8 19z"/><path d="M14.5 6.5l3 3"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
</defs></svg>
