name: android-build

on:
  workflow_dispatch:   # 수동 실행. Secret(ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD)이 있으면 정식 서명 APK 를 릴리스로 올린다
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  KEY_ALIAS: qtapp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK (licenses and platform)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/sign"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD_SECRET" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign/release.p12"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "정식 서명 키 사용"
          else
            # Secret 이 없으면 빌드가 되는지만 확인하는 임시 키로 서명한다 (배포용이 아님: 사이트 인증과 지문이 다르다)
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/sign/release.p12" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -storepass tempbuildpass -keypass tempbuildpass -dname "CN=temp build" > /dev/null
            echo "mode=temp" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret 이 없어 임시 키로 빌드합니다 (빌드 검증용, 설치/배포용 아님)"
          fi
          keytool -list -keystore "$RUNNER_TEMP/sign/release.p12" -storetype PKCS12 \
            -storepass "${KEYSTORE_PASSWORD_SECRET:-tempbuildpass}" | grep -E "Keystore type|Your keystore contains|$KEY_ALIAS" | head -5

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sign/release.p12
          KEYSTORE_PASSWORD: ${{ steps.key.outputs.mode == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || 'tempbuildpass' }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Verify signature and site link (assetlinks)
        id: verify
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          GOT=$(grep -m1 "certificate SHA-256 digest" /tmp/certs.txt | awk '{print toupper($NF)}')
          WANT=$(python3 -c "import json;print(json.load(open('qt-app/web/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0].replace(':',''))")
          echo "APK 서명 지문:  $GOT"
          echo "사이트 선언 지문: $WANT"
          if [ "$GOT" = "$WANT" ]; then echo "match=yes" >> "$GITHUB_OUTPUT"; echo "지문 일치: 주소창 없는 전체 화면으로 열립니다"
          else echo "match=no" >> "$GITHUB_OUTPUT"; echo "::warning::지문이 다릅니다 (임시 키이거나 assetlinks.json 이 다른 키를 가리킴)"; fi
          if [ "${{ steps.key.outputs.mode }}" = "release" ] && [ "$GOT" != "$WANT" ]; then echo "정식 키인데 지문이 다릅니다: 중단"; exit 1; fi
          cp "$APK" qtsermon.apk

      - name: Publish release (official key only)
        if: steps.key.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v1.0.${{ github.run_number }}"
          gh release create "$TAG" qtsermon.apk --title "한 구절 묵상 APK 1.0.${{ github.run_number }}" \
            --notes "폰에서 이 APK 를 받아 설치합니다. 앱 내용은 사이트에서 오므로 사이트 업데이트는 재설치 없이 반영됩니다. 앱 자체(아이콘/이름)가 바뀔 때만 새 APK 를 설치하세요." --latest
          echo "다운로드: https://github.com/${{ github.repository }}/releases/latest/download/qtsermon.apk"

      - name: Upload test build (temporary key only)
        if: steps.key.outputs.mode == 'temp'
        uses: actions/upload-artifact@v4
        with:
          name: qtsermon-TEMP-KEY-not-for-install
          path: qtsermon.apk
          retention-days: 3
