name: check-new-sermon

on:
  schedule:
    # 매일 11:00~23:00 KST 한 시간 간격 + 23:30 KST 마지막 확인.
    # cron은 UTC 기준(한국 시간 -9시간). GitHub 사정으로 몇 분~수 시간 지연되거나 빠질 수 있음
    - cron: "0 2-14 * * *"   # 11:00 ~ 23:00 KST, 매시 정각
    - cron: "30 14 * * *"    # 23:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sermon-mailer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run mailer
        timeout-minutes: 25   # 이 단계가 시간 초과로 끊겨도 아래 저장 단계는 실행된다 (남은 설교는 다음 실행에서 처리)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python sermon_mailer.py
      - name: Build dashboard data
        if: always()
        run: python build_site.py
      - name: Save seen list and library
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json library docs)" ]; then
            git config user.name "sermon-bot"
            git config user.email "sermon-bot@users.noreply.github.com"
            git add seen.json library docs
            git commit -m "update seen videos"
            git push
          fi
