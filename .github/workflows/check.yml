name: check-new-sermon

on:
  schedule:
    # 하루 3번 (cron은 UTC 기준, 한국 시간은 +9시간). GitHub 사정으로 몇 분~수십 분 지연될 수 있음
    - cron: "30 2 * * *"    # 11:30 KST
    - cron: "0 10 * * *"    # 19:00 KST
    - cron: "30 13 * * *"   # 22:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sermon-mailer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run mailer
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python sermon_mailer.py
      - name: Build dashboard data
        run: python build_site.py
      - name: Save seen list and library
        run: |
          if [ -n "$(git status --porcelain seen.json library docs)" ]; then
            git config user.name "sermon-bot"
            git config user.email "sermon-bot@users.noreply.github.com"
            git add seen.json library docs
            git commit -m "update seen videos"
            git push
          fi
