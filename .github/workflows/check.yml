name: check-new-sermon

on:
  schedule:
    # 매일 11:17~23:17 KST 한 시간 간격 + 23:47 KST 마지막 확인.
    # cron은 UTC 기준(한국 시간 -9시간). GitHub는 정각에 몰리는 예약 실행을 자주 건너뛰어서(실측: 하루 14회 설정에 1~3회 실행)
    # 일부러 정각을 피해 17분/47분으로 잡았다. 그래도 지연되거나 빠질 수 있다.
    - cron: "17 2-14 * * *"  # 11:17 ~ 23:17 KST
    - cron: "47 14 * * *"    # 23:47 KST
  workflow_dispatch:
    inputs:
      test_video:
        description: "테스트: 이 유튜브 영상 ID 하나만 메일로 보내본다 (기록은 건드리지 않음). 비워두면 평소처럼 실행"
        required: false
        default: ""
      library_videos:
        description: "보충: 이 영상 ID(쉼표로 여러 개)를 메일 없이 요약해 라이브러리/앱에만 추가한다 (최근 영상 목록에 있는 것만)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sermon-mailer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run mailer
        timeout-minutes: 25   # 이 단계가 시간 초과로 끊겨도 아래 저장 단계는 실행된다 (남은 설교는 다음 실행에서 처리)
        env:
          TEST_VIDEO: ${{ github.event.inputs.test_video }}
          LIBRARY_VIDEOS: ${{ github.event.inputs.library_videos }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python sermon_mailer.py
      - name: Build dashboard data
        if: always()
        run: python build_site.py
      - name: Save seen list and library
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json library docs)" ]; then
            git config user.name "sermon-bot"
            git config user.email "sermon-bot@users.noreply.github.com"
            git add seen.json library docs
            git commit -m "update seen videos"
            git push
          fi
