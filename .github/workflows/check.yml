name: check-new-sermon

on:
  schedule:
    # cron은 UTC 기준, 한국 시간은 +9시간. GitHub 사정으로 몇 분~수 시간 지연될 수 있음
    - cron: "0 3 * * 1-5"           # 평일(월~금) 12:00 KST
    - cron: "30 8 * * 1-5"          # 평일(월~금) 17:30 KST
    - cron: "0 12 * * 5"            # 금 21:00 KST (주말 일정 시작)
    - cron: "0 0,3,6,9,12 * * 0,6"  # 토·일 09/12/15/18/21시 KST
    - cron: "0 14 * * 0"            # 일 23:00 KST (마지막 실행)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sermon-mailer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run mailer
        timeout-minutes: 12   # 이 단계가 시간 초과로 끊겨도 아래 저장 단계는 실행된다
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python sermon_mailer.py
      - name: Build dashboard data
        if: always()
        run: python build_site.py
      - name: Save seen list and library
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json library docs)" ]; then
            git config user.name "sermon-bot"
            git config user.email "sermon-bot@users.noreply.github.com"
            git add seen.json library docs
            git commit -m "update seen videos"
            git push
          fi
