name: backfill-library

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 새벽 3시(KST)에 지난 설교를 몇 편씩 라이브러리에 채운다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sermon-mailer   # check.yml과 동시에 돌지 않도록 같은 그룹
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill past sermons
        timeout-minutes: 20   # 이 단계가 시간 초과로 끊겨도 아래 저장 단계는 실행된다
        env:
          BACKFILL: "3"   # 하루에 채울 설교 수 (Gemini 무료 한도 안에서)
          DRY_RUN: "0"
          BACKFILL_ONLY: "1"   # 라이브러리만 채우고 새 설교 메일은 보내지 않는다
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python sermon_mailer.py
      - name: Build dashboard data
        if: always()
        run: python build_site.py
      - name: Save seen list and library
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json library docs)" ]; then
            git config user.name "sermon-bot"
            git config user.email "sermon-bot@users.noreply.github.com"
            git add seen.json library docs
            git commit -m "backfill library"
            git pull --rebase
            git push
          fi
