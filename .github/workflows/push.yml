name: push-notify

on:
  schedule:
    # 매일 아침 QT 알림. cron 은 UTC(한국 시간 -9시간): 22:13 UTC = 다음 날 07:13 KST.
    # 정각을 피한 이유: GitHub 가 정각 예약 실행을 자주 건너뛴다 (그래도 늦거나 빠질 수 있다)
    - cron: "13 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test: 테스트 알림 / qt-reminder: 오늘의 QT 알림"
        type: choice
        options: [test, qt-reminder]
        default: test
      dry_run:
        description: "검증만 하고 실제로는 보내지 않는다"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qt-app/scraper/requirements.txt
      - run: pip install "firebase-admin>=6.5" "pywebpush>=2.0"
      - name: Send push
        env:
          MODE: ${{ github.event.inputs.mode || 'qt-reminder' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEBPUSH_VAPID_PRIVATE: ${{ secrets.WEBPUSH_VAPID_PRIVATE }}
        run: python scripts/send_push.py
